# TRC 실험 계약 — Phase 0
#
# 이 파일의 값은 실험 도중 바뀌면 안 된다. 근거는 Research Design/설계_확정사항.md,
# 구현 상세는 Research Design/implementation_spec.md 를 본다.
# 작성 2026-08-05.

experiment_id: TRC_KNOWN_DGP_BENCHMARK_V1

data:
  panel: data/processed/paired_2026_2030_model_input.parquet
  codebook: data/DATAMAP_평일 통행·업무 통행 설문조사_260623 (2).xlsx

split:
  # 반드시 parquet 안의 split 컬럼을 쓴다.
  # data/splits/respondent_holdout/split70_seed42.csv 를 쓰면 응답자 42%가 다르게 배정되어
  # 제한 도메인이 1,520/8,080, 649/3,504 로 나오고 Gate 1 이 실패한다.
  source: column
  column: split
  development: [train]
  test: [validation, test]           # 두 held-out 층을 합쳐 30% test
  forbidden: data/splits/respondent_holdout/split70_seed42.csv

  expected:
    full_panel:            {respondents: 2178, cases: 13068}
    full_development:      {respondents: 1524, cases: 9144}
    full_test:             {respondents: 654,  cases: 3924}
    restricted_development: {respondents: 1518, cases: 8116, retain: 6588, av: 1528}
    restricted_test:        {respondents: 651,  cases: 3468, retain: 2858, av: 610}
    excluded_other_non_av:  {development: 1028, test: 420}

outcome:
  positive: AV                       # future_mode_label == "AV"
  negative: exact_retention          # future_mode_label == current_mode_label
  excluded: other_non_AV             # 그 외 전환
  # 후보 문자열은 둘 다 1토큰이어야 한다. Retain 은 Qwen 에서 Ret+ain 2조각이라
  # 학습 손실(토큰 평균)이 유지 쪽으로 1.5배 기울었다. Keep 으로 바꿔 대칭을 맞췄다.
  alternative_tokens: [AV, Keep]     # broad-label 재사용본을 볼 때만 CURRENT

units:
  fare: kKRW                         # av_cost_1000won, 범위 4.0–28.5, 중앙값 6.0
  time: minute
  vot: kKRW_per_hour
  # 유한차분 분모는 (거리대, 속성) 별 스텝 h 다: D_a p = (p(a+h) - p(a-h)) / (2h).
  # 요금이 kKRW 단위이므로 2000 이 아니며, 사다리를 거리대별로 바꿨으므로 상수 2 도 아니다.
  central_difference_denominator: "2 * h(band, attr)"

# 정보조건은 **하나뿐이다** (2026-08-07 확정). 태도 문항을 포함한 retro 로 통일한다.
#
# 왜 pro 를 아예 안 돌리나. 태도 유무 비교는 "무슨 정보를 주면 더 맞히나" 를 묻는 것이고,
# 이 연구의 질문("잘 맞히는 모형이 행동을 배웠나")과 다르다. 실험 요인에서 뺀다.
#
# 대가로 두 가지를 잃고, 원고에 적어야 한다.
#   (1) prospective 배포 주장을 할 수 없다. 실제 배포 시점에는 태도 문항이 없다.
#   (2) [철회됨 2026-08-12, D240] 한때 합성 세계의 retro 가 "정답이 무시하는 변수를 더 준
#       상태" 였다 — dgp_specification 에 태도가 없었기 때문이다. 사용자가 이를 의도한 적
#       없다고 확인했고, 원 설계(합성데이터_생성_전체.md 의 Q_i)에도 attitudes 가 있으므로
#       persona 에 태도 14문항을 추가하고 HOM/CD 정답을 재합성했다. 이제 합성 세계의
#       프롬프트가 보여주는 태도는 정답 규칙에도 들어가는 실제 신호다.
information_conditions: [retro]

# 자료 셋. 실제 서울 SP 하나 + 합성 둘.
#   HOM  로짓 · 선형 효용            (MNL 이 정확히 표현할 수 있는 세계)
#   CD   로짓 · 곱형태 Cobb-Douglas  (참고 논문 Martin-Baos et al. 2023 식 22)
# PB / PBCD / LC / NL / RC 는 artifacts/archive/20260807/ 로 보관했다. 코드는 남아 있으므로
# 아래 목록에 다시 넣으면 되살아난다.
worlds: [HOM, CD, HUMAN]
synthetic_worlds: [HOM, CD]

grid:
  human:                              # 주 실험
    worlds: [HUMAN]
    information_conditions: [retro]
    # 2026-08-05 축소: 인간자료도 seed 42 하나만 돌린다.
    # **잃는 것**: fine-tuning seed 분산을 아예 측정할 수 없다. 원래는 "모델 간 차이가
    # seed 분산보다 작으면 차이를 주장하지 않는다" 는 규칙을 쓰기로 했는데, 그 기준 자체가
    # 사라진다. 따라서 LLM 모델 간 비교는 방향만 보고하고 크기 차이는 주장하지 않는다.
    llm_seeds: [42]
    llm_runs: 1                       # qwen x HUMAN x retro x seed42
  synthetic:                          # 보조 실험 (known-DGP 정확 회복 감사)
    worlds: [HOM, CD]
    information_conditions: [retro]
    llm_seeds: [42]
    llm_runs: 2                       # qwen x {HOM, CD} x retro x seed42
  tabular_seeds: [42, 123, 999]       # tabular 은 저렴하므로 전 세계에서 다중 seed
  # tabular 은 seed 3개를 유지한다. LLM 만 1개다. 두 계열의 seed 수가 다르므로
  # 표에 반드시 명시하고, seed 분산이 필요한 진술은 tabular 에서만 한다.
  execution_order: [human, synthetic] # 인간자료 12회를 먼저 전부 돌린다

  # 축소로 잃는 것: 합성 세계에는 LLM seed 분산과 정보조건 대비가 없다.
  # 표·본문에 "단일 fine-tuning seed 기준" 라벨을 달고, 두 모델 차이가 인간자료에서 측정한
  # seed 분산보다 작으면 차이를 주장하지 않는다.
  synthetic_single_seed_caveat: true

edits:
  # 고정 절대 사다리는 폐기했다. SP 설계 범위보다 넓어서 D1(0.5-2km)은 세 속성 모두
  # in-support 편집이 0 건이었고, in-support 주분석이 단거리 통행을 통째로 배제했다.
  # 대신 거리대별로 설계 범위에서 스텝을 유도한다. 실제 값은 configs/trc_band_ladders.yaml.
  mode: band_scaled
  source: configs/trc_band_ladders.yaml
  rule: "h(band, attr) = round_to_grid((design_max - design_min) / 3, grid)"
  grid: {fare: 0.25, ride: 1.0, wait: 1.0}   # kKRW / minute
  ladder: "{-3h, -2h, -h, +h, +2h, +3h}"     # 속성당 6개, baseline 포함 7점
  deprecated_fixed:                          # 참고용. 사용 금지.
    fare: [-3, -2, -1, 1, 2, 3]
    ride: [-15, -10, -5, 5, 10, 15]
    wait: [-9, -6, -3, 3, 6, 9]

scenarios:
  S1: {fare_pct: -30}
  S2: {fare_pct: -15}
  S3: {ride_min: -15}
  S4: {wait_min: -5}
  S5: {fare_pct: -30, wait_min: +5}
  S6: {fare_pct: +20, ride_min: -10}
  S7: {fare_pct: +15, wait_min: -3}
  S8: {fare_pct: -30, ride_min: -10, wait_min: -3}
  common_cohort: true                # primary 집계는 S0–S8 공통 유효 코호트

inference_grid:
  conditions_per_case: 33            # 1 baseline + 24 single edits + 8 bundles
                                     # 단일편집 24 = 요금·차내·대기 18 + AV 신뢰도 6
  max_scenario_rows: 114444          # 3468 * 33

# DGP anchor 추정에 쓰는 명세. 후보모형 feature 와 달리 이쪽은 진실을 만드는 모형이므로
# pro 스키마 범위 안에서 해석 가능한 소수 변수만 쓴다 (태도 미사용).
dgp_specification:
  service_attributes:                # 부호제약이 걸리는 세 변수
    fare: av_cost_1000won            # kKRW
    ride: av_travel_time_min         # minute
    wait: av_wait_time_min           # minute
  controls:                          # task 수준 통제
    # **av_framing_percent 를 쓰지 않는다.** 그 열은 두 프레이밍의 숫자를 그대로 한 열에
    # 담고 있어서, (1) 표준화 sigma 가 49.997 이 되어 0.001%p 변화가 Δz=0.00002 로 눌리고
    # (2) 프레이밍 더미와 상관이 정확히 1.0000 이라 계수가 따로 식별되지 않았다.
    # 코드북 정의("큰 중단 없이 통행을 정상 완료할 가능성")대로 하나의 공통 척도로 환산한
    # av_service_reliability_pct (99.99~100%) 를 쓴다. 공선성 |r| 0.0095 로 떨어진다.
    numeric: [av_service_reliability_pct]
    # distance_band 더미는 뺐다. D-efficient 설계가 통행시간을 주로 대역 사이에서
    # 변화시켜 R2(ride ~ 대역더미) = 0.977 이고, 더미가 통행시간 계수를 흡수해
    # 잠재계층에서 beta_ride 가 부호제약 경계로 밀리며 VOT 가 0 으로 붕괴했다.
    categorical: [current_mode_label, av_framing_attribute]
  persona:                           # 응답자 수준, 효용식에 들어감
    # 2026-08-12 (D240): 태도 14문항(A1_1..A1_10, T1, T4, S1, S2)을 추가했다. 이전에는
    # 인구통계만 넣어서 합성 세계의 정답이 프롬프트가 보여주는 태도를 무시했는데, 사용자가
    # 그 함정을 의도한 적 없다고 확인했다. 원 설계 문서(합성데이터_생성_전체.md)의 Q_i
    # 정의에도 attitudes 가 들어 있다. 패널에서 14열 모두 결측 0 확인.
    # 이 목록을 바꾸면 p05 -> p06 -> p06b -> p08 -> p10 -> p14 를 다시 흘려야 한다.
    numeric: [age, D4_1, D4_2, D5, D6,
              A1_1, A1_2, A1_3, A1_4, A1_5, A1_6, A1_7, A1_8, A1_9, A1_10,
              T1, T4, S1, S2]
    categorical: [SQ2, D7, D8]
  membership:                        # LC 클래스 소속 모형 (persona 만)
    numeric: [age, D5, D6, D4_1]
    categorical: [SQ2, D7, D8]
  max_categorical_levels: 8          # 초과하면 추정에서 제외하고 로그에 남긴다
  standardize_numeric: true
  # 서비스 속성을 거리대 내에서 중심화한다. 대역 간 변동(= 통행 길이)을 빼고 실험이 만든
  # 대역 내 변동만으로 계수를 식별한다. 중심화는 위치 이동이므로 유한차분과 VOT 는 불변이다.
  center_service_within_band: true
  missing:
    numeric: median
    categorical: explicit_level      # "__missing__" 수준을 만든다
  optimizer:
    method: L-BFGS-B
    max_iter: 2000
    tolerance: 1.0e-10
    sign_epsilon: 1.0e-6             # beta <= -eps 로 강제
  latent_class:
    n_classes: 3
    n_starts: 8
    em_max_iter: 800
    em_tolerance: 1.0e-7             # 상대. ll~-2650 에서 절대 2.6e-4. EM 표준 수준.
    m_step_max_iter: 25              # generalized EM. 완전 수렴 불필요.
    ridge_penalty: 0.0               # 사용하지 않는다. 계수 발산의 원인은 벌점 부재가 아니라
                                     # 거리대 더미와 통행시간의 공선성이었고, 대역 내 중심화로
                                     # 해결됐다. 옵션은 진단용으로만 남긴다.
    min_class_share: 0.05
  mixed_logit:
    # 추정용 draw. 해석적 gradient 가 없어 파라미터 수(52)만큼 수치미분이 들어가므로
    # 200 draw 는 반복당 8초로 비현실적이다. 시뮬레이션 우도는 draw 수에 거의 무관하다
    # (20/50/200 draw 에서 NLL = 6210.75 / 6210.43 / 6210.73). 50 으로 충분하다.
    n_draws: 50
    n_draws_check: 200               # 추정 후 안정성 확인용
    draw_type: halton
    n_starts: 2
    # 해석적 gradient 구현 후에는 gradient 1회가 NLL 2-3배 비용이라 반복을 넉넉히 준다.
    # 수치미분 시절(파라미터 52개마다 NLL 재계산)에는 400 회에서 멈춰 세 사양 모두
    # "수렴 실패"로 나왔는데, 그건 식별 문제가 아니라 반복 예산 부족이었다.
    max_iter: 3000

dgp:
  sign_constraints:                  # HOM, LC 모두. LC 는 클래스별로.
    beta_fare: negative
    beta_ride: negative
    beta_wait: non_positive
  nl:
    components: [fare_sq, ride_sq, wait_sq, fare_x_ride, ride_x_wait]
    allocation: equal_standardized   # 성분별 표준화 후 등가중 1/5, 클래스별 배율 c_k 만 수치해
    weight_per_component: 0.2
    primary_rho: 0.25
    robustness_rho: [0.10, 0.40]
    on_constraint_failure: fail      # 조용히 clipping 하지 않는다
    inherit_class_from: LC
  rc:
    space: wtp                       # coefficient space 아님
    covariance_fallback: [full, diagonal, fare_vot_random_wait_fixed]
    convergence:
      gradient_norm: 1.0e-4
      distinct_starts: 2
    marginal_integration: fixed_node_quadrature
    integration_tolerance: 1.0e-5
    n_quadrature_nodes: 400
    # 취향 분포의 산포는 추정치를 그대로 쓰지 않고 DGP-LC 에서 유도한 값으로 선언한다.
    # 대역 내 중심화 뒤 통행시간의 실험 변동이 sd 2.99분뿐이라 RC 의 개인별 산포가
    # 식별되지 않고(추정 시 VOT 분위 0.003 / 0.737 / 185.0 로 5자릿수 폭발), 그대로 두면
    # 행동세계로 쓸 수 없다. LC 의 클래스 VOT 를 membership 가중한 로그 평균·sd 를 목표로
    # 삼으면 DGP-RC 와 DGP-LC 가 이질성의 **양**은 같고 **형태**(연속 vs 이산)만 다르게 되어,
    # 난이도 사다리가 한 번에 한 가지 어려움만 격리한다는 설계 의도와 맞는다.
    # DGP-NL 의 rho 를 선언값으로 고정한 것과 같은 논리다.
    taste_scale_calibration: from_latent_class
  harmonization:
    target: development_observed_av_share
    aggregation: respondent_first
    method: bisection_on_intercept

labels:
  generate_from: conditional_truth   # marginal 로 만들면 latent state 가 무력화된다
  recovery_target: marginal_truth
  heterogeneity_target: conditional_truth

thresholds:                          # 사전등록. 결과를 본 뒤 변경 금지.
  response_direction: 0.01           # tau_a
  monotonicity: 0.002                # tau_mono
  vot_denominator: 0.002             # kappa_F, per kKRW
  robustness_multipliers: [0.5, 2.0]

seeds:
  common_choice_threshold: 202701    # hash(seed, case_id) 로 행 순서 비의존 생성
  latent_class_draw: 202702
  random_coefficient_draw: 202703
  sft: [42, 123, 999]

sft:
  quantization: NF4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # LoRA 대상 — Qwen3.5-9B 전용. "all_linear" 같은 축약을 쓰지 않는 이유가 있다.
  #
  # 이 모델은 **하이브리드 선형 어텐션**이다. 32층 중 8층(3,7,11,...,31)만 표준 어텐션
  # (self_attn.q/k/v/o_proj)이고 나머지 24층은 선형 어텐션이라 이름이 전혀 다르다
  # (linear_attn.in_proj_qkv / in_proj_a / in_proj_b / in_proj_z / out_proj).
  # 표준 이름만 적으면 **어텐션의 4분의 3에 LoRA 가 안 붙는다**.
  #
  # 또 이 체크포인트는 멀티모달이다. model.visual(333 텐서)은 이름이 겹치지 않아 안전하지만
  # mtp(다중토큰 예측 헤드)는 q_proj..down_proj 를 그대로 갖고 있어 제외하지 않으면
  # 추론에 쓰지도 않는 모듈을 학습하게 된다.
  #
  # 파라미터: 표준 이름만 = 29.1M(128모듈) / 선형어텐션 포함 = 43.3M(248모듈, 전체의 0.45%)
  target_modules:
    - q_proj          # 표준 어텐션 8층
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv     # 선형 어텐션 24층
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_proj       # MLP 32층
    - up_proj
    - down_proj
  exclude_modules: '.*mtp\..*'       # 추론에 쓰지 않는 다중토큰 예측 헤드
  # 목적함수. 기본은 표준 SFT(토큰 교차엔트로피)다.
  #   token_ce    정답 글자의 우도를 올린다. 다수(Keep 82%)로 쏠린다 - margin 평균 -1.753.
  #   margin_bce  AV/Keep 점수차를 이항 분류기처럼 직접 민다. pos_weight 로 불균형을 다룬다.
  #               분모가 상수라 배치 1 에서도 가중치가 상쇄되지 않는다 (pipeline/margin_bce.py).
  # **전체 설계의 고정 프로토콜은 token_ce 다.** margin_bce 는 0.8B 절제실험용이고,
  # 규모 사다리 비교(0.8B/2B/9B)는 같은 목적함수로 학습한 어댑터끼리만 한다.
  objective: token_ce
  pos_weight: 2.233                  # margin_bce 일 때만. 선행 프로젝트가 쓴 값
  # aaai_composite 목적함수의 구성비. 값의 출처는 선행 프로젝트의 실행 기록이다 —
  # methods/fine_tuning/outputs/qwen35_9b_v0108_stage1_adapter_remote_20260713/
  # training_manifest.json 의 loss.formula 와 train_av_pairwise_lora.py:727-753.
  #   0.90*(0.65*wBCE + 0.25*focal_gamma2 + 0.10*Brier) + 0.10*format_CE
  # 앞 세 개의 합은 1 이어야 한다 (그쪽 validate_loss_weights 와 같은 제약).
  loss_composite:
    wbce_weight: 0.65
    focal_weight: 0.25
    brier_weight: 0.10
    focal_gamma: 2.0
    binary_weight: 0.90
    format_weight: 0.10
    # 소수 클래스 보정 (Menon et al., ICLR 2021 "Long-tail learning via logit adjustment").
    # margin 에 tau*log(pi_AV/pi_Keep) 를 학습 중에 더한다. tau=1 이면 추론 때
    # margin>0 의 경계가 기저율(0.1883)에 놓인다. 0 이면 끄는 것이다.
    # **켤 때는 pos_weight 를 1.0 으로 두라** - 둘 다 경계를 옮겨 이중으로 적용된다.
    logit_adjust_tau: 1.0
  optimizer: adamw
  learning_rate: 0.0002
  schedule: cosine
  warmup_ratio: 0.03
  effective_batch_size: 16
  epochs: 3
  runs: 20                           # 인간 12 + 합성 8 (grid 참조)
  optimizer_steps_per_run: 1524      # ceil(8116/16) * 3
  optimizer_steps_total: 30480
  # 아래 둘은 통계적 사양이 아니라 이 장비의 처리량 설정이다. p16 에 박아두면
  # 장비가 바뀔 때 코드를 고쳐야 하므로 여기로 뺐다. 값의 근거는 RUN_LOG 의 속도 측정.
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  # fp16 학습에서 GradScaler 가 시작하는 배율. **float16 일 때만 쓰인다** (로컬·3080 은
  # bfloat16 이라 무시된다). torch 기본값은 65536 인데, 그 값에서 overflow 가 나면 그 step 의
  # optimizer 갱신이 통째로 버려지고 배율이 절반이 된다. 65536 에서 8 까지 내려오는 데
  # 13번 halving 이 필요하고, 그 13 step 은 forward/backward 를 다 하고도 학습이 0 이다.
  # 선행 AAAI 프로젝트가 같은 GV100·같은 fp16 에서 이 문제를 겪고 8 로 낮췄다
  # (training_manifest.json 의 fp16_grad_scaler.previous_initial_scale: 65536.0 이 그 흔적).
  fp16_initial_scale: 8
  # 체크포인트. 어댑터 하나가 수십 시간이라 끝에서만 저장하면 중간에 죽을 때 통째로 잃는다.
  # 반 에포크마다 저장하면 최악의 손실이 254 step 으로 제한된다.
  # LoRA 체크포인트는 38.8M 파라미터라 개당 약 80MB. 최근 2개만 남긴다.
  save_steps: 254                    # 1524 / 6 = 반 에포크
  # **전부 남긴다.** 전에는 2 였는데, 그러면 254·508 번 체크포인트가 지워져 학습이
  # 진행되며 성능이 어떻게 변했는지 나중에 재구성할 수 없다. 어댑터는 LoRA 라 작다
  # (0.8B 82MB, 9B 약 170MB) - 어댑터 하나에 6개를 다 남겨도 0.5~1GB 다.
  # 디스크 1GB 로 "언제부터 맞히기 시작했는가" 를 볼 수 있으면 남는 장사다.
  save_total_limit: 8
  resume_from_checkpoint: true

# 학습 설정 묶음. --profile 로 골라 위 sft 값을 덮어쓴다.
#
# aaai: 선행 AAAI 프로젝트가 9B 를 학습할 때 쓴 값 그대로다. 출처는
#   C:/SP_LLM/methods/fine_tuning/train_av_pairwise_lora.py:343-352 의 기본값.
#   같은 base model(Qwen3.5-9B), 같은 4bit NF4, 같은 LoRA r=16/alpha=32 인데
#   **학습량이 다르다** - AAAI 는 effective batch 5 로 1 epoch 이고, TRC 기본값은
#   effective batch 16 으로 3 epoch 이다. 논문에 쓴 SFT-100 은 step 100,
#   즉 500 샘플만 본 어댑터다 (TRC 기본은 24,384 샘플로 49배).
#
# 일부러 가져오지 않은 것 둘:
#   max_seq_len   AAAI 는 3072, 우리는 1280 을 그대로 쓴다. 프롬프트 자체가 다르다.
#   target_modules AAAI 는 all-linear 인데, 이 체크포인트는 멀티모달이라 그러면
#                 model.visual(333 텐서)까지 학습된다. 위 sft.target_modules 의
#                 명시 목록을 유지한다 (근거는 그 주석 참조).
sft_profiles:
  aaai:
    learning_rate: 1.0e-4            # TRC 기본 2e-4 의 절반
    schedule: linear                 # TRC 기본은 cosine
    warmup_ratio: 0.0                # TRC 기본은 0.03
    weight_decay: 0.0
    effective_batch_size: 5          # per-device 1 x accum 5 와 같은 값
    epochs: 1                        # 1 epoch 씩 끊고 이어 붙인다 (--round)
    save_steps: 100                  # AAAI 의 step100/200/400 체크포인트가 여기서 나왔다
    # logit_adjust_tau 를 켰으므로 pos_weight 는 1.0 으로 둔다. 둘 다 경계를 옮기는
    # 장치라 함께 쓰면 이중으로 적용된다 (2.233 은 경계를 0.3093 에, tau=1 은 0.1883 에).
    pos_weight: 1.0
    # 1 epoch 이 1,624 step 이라 100 마다 저장하면 체크포인트가 16개 생긴다. 기본값 8 이면
    # step 900 을 저장하는 순간 **step 100 이 지워진다** - 하필 AAAI SFT-100 과 비교할
    # 바로 그 지점이다. 16개를 다 남긴다 (9B LoRA 어댑터 하나가 약 170MB, 합쳐 2.7GB).
    save_total_limit: 20

calibration:
  method: platt
  slope_constraint: positive         # a > 0
  fit_on: development_only
  cv: respondent_grouped
  n_calibrators: 32                  # SFT 20 + zero-shot 12
  # zero-shot 점수는 세계 무관이므로 뱅크는 4개(model x info)면 되고 보정기만 세계별로 적합.
  # zero-shot 보정기 = 합성 4세계 x pro x 2모델(8) + HUMAN x 2조건 x 2모델(4) = 12
  # adapter 자체는 development 전체로 1회 학습한다. 따라서 "development-only grouped
  # calibration" 이라고 쓰고 "fully cross-fitted base-model probabilities" 라고 쓰지 않는다.
  claim: development_only_grouped_calibration

evaluation:
  aggregation: respondent_first
  bootstrap:
    unit: respondent
    replications: 2000
  multiple_comparison: bh_fdr
  primary_conditions:
    - multiple_seeds
    - primary_rho_0.25
    - in_support_stratum
    - development_only_calibration

human_reference:
  primary: latent_class_k3_train_only
  secondary: pooled_panel_logit
  pooled_candidate_in_secondary: self_reference   # 순위에서 제외
  forbidden_terms:
    - counterfactual human accuracy
    - true human response error
  required_term: human-referenced response correspondence

# LLM 실행 환경. 경로와 배치는 여기서만 읽는다.
llm:
  model_root: C:/SP_LLM/models
  families:
    # research: 논문에 보고되는 모델군인가. smoke 는 배관 검증 전용이므로 false 다.
    # 이 구분이 없으면 p25 가 "미확보 모델군: llama, smoke" 라고 경고해, 확보해야 할
    # 모델이 둘인 것처럼 읽힌다. 실제로 확보가 필요한 것은 llama 하나다.
    qwen:
      path: qwen/Qwen__Qwen3.5-9B
      available: true
      research: true
    llama:
      path: llama/Meta-Llama-3.1-8B-Instruct
      # 2026-08-21 확보. unsloth/Llama-3.1-8B-Instruct 미러(가중치는 Meta 원본과 동일한
      # 재배포판, 게이트 없음)를 GV100 HF 캐시에서 옮겼다. AAAI 단계에서 쓰던 사본이다.
      # 원고에는 미러 출처를 명시한다.
      available: true
      research: true
    llama_small:
      # Llama 에는 2B 급이 없어 3.2-3B 를 쓴다. 3B(3.2)와 8B(3.1)는 세대가 달라
      # Qwen 사다리처럼 "구조 동일, 크기만 다름" 이라고는 못 쓴다 - 원고에 명시.
      path: llama/Llama-3.2-3B-Instruct
      available: true
      research: true
    gemma:
      # Gemma 2 는 2B 와 9B 가 **같은 세대**다 - llama 쌍(3.2/3.1)의 약점이 없다.
      # unsloth 미러(게이트 없음). 서식이 system 역할을 지원하지 않아 render_chat 이
      # system 을 첫 user 앞에 접어 넣는다 (2026-08-22, "System role not supported" 실측).
      path: gemma/gemma-2-9b-it
      available: true
      research: true
    gemma_small:
      path: gemma/gemma-2-2b-it
      available: true
      research: true
    # 규모 사다리 (2026-08-06 추가). **같은 계열, 같은 어휘(248,320), 크기만 다르다.**
    #   0.8B  24층(선형 18 + 전체 6)  hidden 1024   1.7GB
    #   2B    24층(선형 18 + 전체 6)  hidden 2048   4.4GB
    #   9B    32층(선형 24 + 전체 8)  hidden 4096  18.4GB
    # 구조가 같으므로 성능 차이를 **크기 하나로** 귀속할 수 있다. 서로 다른 계열을
    # 비교하면 학습자료·토크나이저·구조가 한꺼번에 달라 무엇 때문인지 알 수 없다.
    #
    # 왜 하는가. 9B 는 GV100 에서 어댑터 하나에 3.2일이라 규모 대비를 붙일 여유가 없다.
    # 소형은 RTX 3080(10GB)에 들어가고 훨씬 빠르므로, 노는 카드에서 규모 축을 얻는다.
    # "행동 재현력이 크기를 따라 좋아지는가, 아니면 일찍 평평해지는가" 는 이 문헌에
    # 아직 답이 없는 질문이다.
    # 2026-08-07: 둘 다 껐다. 3080 을 쓰지 않기로 했고 GV100 은 9B 전용이다
    # (scripts/setup_gv100.sh 의 FAM='qwen'). **크기 사다리는 포기한다** — 원고에는
    # 단일 규모(9B) 결과로 쓰고 크기 효과를 주장하지 않는다.
    qwen_small:
      path: qwen/Qwen__Qwen3.5-0.8B
      available: false
      research: true
      note: 3080 폐기로 중단. 되살리려면 available 을 true 로.
    qwen_mid:
      path: qwen/Qwen__Qwen3.5-2B
      available: true
      research: true
      # 2026-08-10 재개. 가중치 4.26GB 를 GV100 에도 복사해서 세 대 모두에 있다
      # (워크스테이션 C:/SP_LLM/models, GV100 C:/Users/dell/models, 3080).
      note: 3 epoch 어댑터에서 warm restart 로 이어 학습 중.
    smoke:                      # 파이프라인 검증 전용 소형 모델. 결과 보고용 아님.
      path: qwen/Qwen__Qwen2.5-0.5B-Instruct
      available: false
      research: false
  # **4bit NF4 로 확정 (2026-08-05).**
  #
  # 알려진 반론: Unsloth 문서가 Qwen3.5 계열에 4bit QLoRA 를 비권장한다
  # ("higher than normal quantization differences", 커스텀 Mamba Triton 커널이 이유).
  # 우리가 확인한 구조도 이와 일치한다 — 32층 중 24층이 linear_attn 이고 conv1d 를 갖는다.
  #
  # 그럼에도 4bit 로 가는 근거 셋.
  #  (1) **선행 연구가 같은 모델을 같은 설정으로 돌렸다.** AAAI 9B 본학습의 training_manifest
  #      에 qlora.enabled=True, quant_type=nf4, lora_r=16, lora_alpha=32 가 기록돼 있다.
  #  (2) **메모리가 어디서든 들어간다.** 학습 peak 7.9GB(실측). 8bit 는 11.4GB, 16bit 는
  #      20.4GB 로 GV100 여유 20.9-23.0GB 에서 16bit 는 여유가 2.5GB 뿐이라 공유 장비에서
  #      며칠 돌리기에 위험하다. 4bit 는 로컬 3060 에서도 돈다.
  #  (3) **소비자 GPU 파인튜닝의 사실상 표준이다** (QLoRA 2023 이후).
  #
  # 다만 이 논문은 확률값 자체(PMAE·PRMSE·CE)를 비교하므로 왜곡 크기를 **숫자로 남긴다**.
  # p15b_quant_diagnostic.py 가 학습 없이 제로샷에서 4bit 대 비양자화의 margin/확률을
  # 비교한다. 이 값은 게이트가 아니라 **보고용**이며, 원고의 한계 절에 인용한다.
  # (margin spearman, 확률 MAE, 부호 뒤집힘률)
  four_bit: true
  # 수치 형식. Ampere(RTX 3060) 는 bfloat16 을 지원하지만 Volta(GV100, sm_70) 는 못 한다.
  # 장비를 옮길 때 코드가 아니라 이 값만 바꾼다. 어댑터 20개는 전부 같은 값으로 만들어야 한다.
  dtype: bfloat16                    # GV100 으로 옮기면 float16
  # 4bit 를 유지하는 이유: GV100 은 32GB 지만 **공유 장비**라 실제 여유가 20.9-23.0GB 다.
  # 압축을 빼면 가중치 18GB + 활성값/옵티마이저로 22-25GB 가 되어 GPU0 에는 안 들어가고
  # 나머지도 빠듯하다. 4bit 는 peak 7.9GB 라 세 장 어디서든 돌고 남의 작업도 밀어내지 않는다.
  # 프롬프트 개정(2026-08-05) 으로 길이가 165 -> 741(pro)/962(retro) 토큰이 됐다.
  # 실측 최대는 retro 의 1002 토큰이라 1024 로는 여유가 20 토큰뿐이고, 문구를 조금만
  # 손대도 조용히 잘린다. 잘리면 페르소나나 질문이 사라져 결과가 오염된다.
  max_seq_len: 1280
  # batch=1 은 15.28 s/prompt, batch=8 은 0.92 s/prompt 로 16.6배 차이가 난다.
  # Qwen3.5 는 커널 폴백이라 배치 효율이 특히 크다. peak 는 batch8 에서 8.35GB.
  score_batch_size: 8
  # p18b 생성 단계에서 뽑을 토큰 수. 'AV'/'Keep' 은 1토큰이지만,
  # 모델이 엉뚱하게 말을 시작하면 그것도 잡아야 하므로 여유를 둔다.
  #
  # 2026-08-17: 4 -> 64 (D248). 4토큰은 한 단어만 담을 수 있어, 모델이 문장을 쓰기
  # 시작하면 첫 조각만 남고 잘린다. 그러면 "자연어를 썼다" 와 "네 토큰 안에 안 끝났다"
  # 를 구분할 수 없다. 64 로 올리면 문장 한 줄이 통째로 들어온다.
  # 비용은 거의 늘지 않는다 - greedy + EOS 라 파인튜닝 모델은 한 토큰 뒤 멈춘다.
  # 문장을 쓰는 것은 지시를 안 따르는 zero-shot 쪽이고, 그게 바로 보려는 대상이다.
  generate_max_new_tokens: 64
  # p18c(이유 생성) 전용. 결정 프롬프트는 **한 단어**를 요구하므로 그 자리에서 문장이
  # 나올 수 없다. 그래서 결정을 받은 뒤 **두 번째 사용자 턴**으로 이유를 묻는다.
  # 결정 프롬프트 자체는 손대지 않는다 - 학습 때 본 문장과 달라지면 그 모델의 판단이
  # 아니게 되고 p18 점수와도 비교가 안 된다.
  # 96 -> 224 (2026-08-18). 2B 이유 2,000건에서 **18.15%가 문장 중간에서 끊겼다**
  # (원문이 종결부호 없이 끝남. 예: "... make it a more"). 평균 288자·최대 452자였고
  # 452자가 상한에 걸린 자리다. 끊긴 문장은 부호 검사(요금 대소를 맞게 말하는가)에서
  # 판정불가가 되므로 그만큼 표본이 준다.
  # 비용은 거의 없다 - EOS 로 멈추므로 짧게 끝나는 사례는 상한과 무관하다.
  rationale_max_new_tokens: 224
  rationale_followup: >-
    In one or two sentences, explain why you answered that way. Refer to the
    specific numbers shown for the two options.
  # p18d(답 먼저, 이유 뒤) 전용.
  # 9B zero-shot 은 결정 프롬프트만 주면 답 대신 "Thinking Process:" 를 쓰기 시작해
  # 64토큰 안에 답이 나오지 않았다(500건 중 후보 일치 0.00%, 2026-08-18). 그래서
  # (1) 답을 **첫 줄에** 쓰라고 형식을 못박고 (2) 토큰을 넉넉히 줘서 잘리지 않게 한다.
  # 결정 프롬프트 본문은 손대지 않는다 - 이 지시만 마지막에 덧붙인다.
  # 256 -> 768 (2026-08-18). 형식을 지키면 한 단어 + 한두 문장이라 80토큰 안에 끝난다.
  # 문제는 **안 지킬 때**다. 9B zero-shot 은 64토큰을 추론 서술에 다 썼는데, 상한이 낮으면
  # "답을 아예 안 쓴다" 와 "생각이 길어 아직 안 나왔다" 를 또 구분할 수 없다. 상한을 올려
  # 미준수의 전체 길이를 관측한다. 준수하는 사례는 EOS 로 멈추므로 시간이 늘지 않는다.
  answer_first_max_new_tokens: 768
  # zero-shot 전용. 위 문장에서 **"Do not write any reasoning before the first line."**
  # 한 줄을 뺀 것이다. style="zeroshot" 은 시스템에서 "먼저 따져 보라" 고 말하는데
  # 위 지시는 "앞에 아무 추론도 쓰지 말라" 라서 서로 어긋난다. 형식 규격은 그대로 두어
  # 파싱은 유지하고, 금지 문장만 뺀다 - 모형이 앞에 추론을 쓰면 format_ok 가 False 로
  # 잡히므로 "지시를 못 지켰다" 가 수치로 남는다.
  answer_first_suffix_zeroshot: >-
    Reply in this format. First line: AV or Keep (one word only, no punctuation).
    Second line: one or two sentences explaining why, referring to the specific numbers
    shown for the two options.
  # named 양식 전용 (2026-08-25). 답이 'AV'/'Keep' 이 아니라 **수단 이름**이라
  # 안내 문구도 그에 맞춰야 한다. 어느 쪽을 고르라는 말은 넣지 않는다.
  answer_first_suffix_named: >-
    Reply in this format. First line: the mode name in braces, for example { Bicycle }
    (that example is not one of the two choices; it only shows the format).
    Second line: one or two sentences explaining why, referring to the specific numbers
    shown for the two modes.
  # neutral / neutralswap 전용 (2026-08-25). 답이 글자 하나다. 예시는 두 후보가 아닌
  # 글자(X)를 써서 예시 자체가 답을 밀지 않게 한다.
  answer_first_suffix_letter: >-
    Reply in this format. First line: the letter in braces, for example { X } (that
    example is not one of the two choices; it only shows the format). Second line: one or
    two sentences explaining why, referring to the specific numbers shown for the two modes.
  answer_first_suffix: >-
    Reply in exactly this format and nothing else. First line: AV or Keep (one word only,
    no punctuation, no explanation). Second line: one or two sentences explaining why,
    referring to the specific numbers shown for the two options. Do not write any
    reasoning before the first line.
  train_batch_size: 1           # RTX 3060 12GB. effective 16 은 grad accumulation 으로.
  smoke:
    train_rows: 200
    test_cases: 40

# ---------------------------------------------------------------------------
# 그룹별 분석 축 (Phase 26)
#
# 참고 논문 Martin-Baos et al. (2023, TR-C) 은 모든 지표를 **집계 수준에서만** 낸다
# (본문에 segment/subgroup 이라는 말이 한 번도 없다). 집계가 맞아도 집단별로 틀릴 수
# 있고, 정책은 대개 "누가 얼마나 영향을 받나" 를 묻는다. 그래서 여기서 한 단계 더 간다.
#
# **관측 축만 쓴다.** 태도 문항(QQ3~QQ7 등)은 retro 조건에서만 프롬프트에 들어가는
# 처치 변수라, 그걸로 집단을 가르면 정보조건 대비와 뒤섞인다.
#
# 축 선정 근거는 persona_config.yaml 의 사전 선별 결과다 (grouped Wald 검정).
#   trip_purpose  p=0.00071(q=0.0049)  현재통행 신호 중 최강
#   age           p=0.0045 (q=0.016)   40세 이후 채택률 급락
#   car_ownership p=0.0041 (q=0.016)
#   income        p=0.0149 (q=0.046)
#   current_mode  p=0.027  (q=0.070)   현상유지 기준점
#   gender        p=0.176  유의하지 않으나 대표성·형평 보고용으로 유지
# distance_band 는 설계 변수라 검정 대상이 아니지만 사다리 스텝이 거리대별로 정의되므로 넣는다.
#
# min_cases 미만인 그룹은 버린다. 그룹이 작으면 추정치가 흔들려 "모형이 집단차를
# 못 살렸다" 와 "표본이 작아 흔들렸다" 를 구분할 수 없다.
group_analysis:
  min_cases: 100
  axes:
    - {name: age_band, source: SQ3, bins: [0, 30, 40, 50, 60, 999],
       labels: ["under 30", "30-39", "40-49", "50-59", "60+"]}
    - {name: gender, source: SQ2}
    - {name: income, source: D5}
    - {name: car_ownership, source: D6}
    - {name: occupation, source: D1}
    - {name: trip_purpose, source: QQ1}
    - {name: current_mode, source: current_mode_label}
    - {name: distance_band, source: distance_band}
    - {name: urbanisation, source: residence_urbanization}
