# TRC feature schema — Phase 0/3
#
# 설문 실시 순서는 DATAMAP 코드북(map 시트, 138행)의 행 순서와 같다. 경계는 다음과 같다.
#
#   행   0–34   SP 이전 : SQ1–SQ5(스크리닝·거주지·성별·연령), QQ1–QQ7(평소 통행 맥락)
#   행  35–100  SP 블록 : Q1A–Q6E, 6개 거리대 × (2026 현재수단 / 고려요인 / 2030 미래수단 /
#                          AV 선택이유 / 이용일수)
#   행 101–137  SP 이후 : A1_1–A1_11, T1–T4, S1–S3_7, D1–D9, R1
#
# 중요: D1–D9(직업·학력·혼인·가구·소득·차량·면허·차량접근성)도 SP 블록 뒤에 배치돼 있다.
# 그러나 이들은 SP 과제 수행으로 값이 달라질 수 있는 항목이 아니라, 조사 말미에 기록되었을 뿐인
# 시간불변 사실이다. 태도 문항과 달리 SP 오염 경로가 없으므로 pro 에 포함한다.
# (기존 파이프라인의 retrospective 목록도 A1/T/S 만 지목하고 D* 는 포함하지 않는다.)
# 이 판단은 원고 4.2.1 에 명시한다.

schemas:

  # ---------------------------------------------------------------- 공통 task 블록
  # Phase 1 퇴화 컬럼 감사 결과를 반영했다.
  # 전량 결측: av/car/pm/walk_transfer_count
  # 상수:      av/car/pm/walk_crowding_raw(='여유'), walk_wait_time_min(=0),
  #            walk_cost_1000won(=0), Quality_Check, SQ4, A1_11
  # 위 항목은 모두 제외한다. pt_transfer_count 와 pt_crowding_raw 는 변동이 있어 유지한다.
  task_attributes: &task
    av:
      - av_cost_1000won        # kKRW
      - av_travel_time_min
      - av_wait_time_min
      - av_framing_percent          # 응답자가 실제로 본 숫자. **LLM 프롬프트가 이걸 쓴다**
      # 코드북 정의("큰 중단 없이 통행을 정상 완료할 가능성")대로 두 프레이밍을 한 눈금으로
      # 합친 것. 숫자를 직접 먹는 쪽(DGP·표 모형)이 쓴다. 위 열을 그대로 쓰면 두 척도가
      # 섞여 프레이밍 더미와 상관 1.0000 이 되고 신뢰도 효과가 표준화에 눌려 사라진다.
      - av_service_reliability_pct
      - av_framing_attribute
    context:
      - distance_band
      - distance_label
      - current_mode_label     # 현재수단 (2026 SP 표에서 제시)
      - choice_set_size
      - available_modes
      - block_ID               # survey block
    incumbent_los:             # 현재수단의 서비스 수준 (선택표에 제시된 값)
      - pt_travel_time_min
      - pt_wait_time_min
      - pt_cost_1000won
      - pt_transfer_count
      - pt_crowding_raw
      - car_travel_time_min
      - car_wait_time_min
      - car_cost_1000won
      - pm_travel_time_min
      - pm_wait_time_min
      - pm_cost_1000won
      - walk_travel_time_min

  # ---------------------------------------------------------------- Q_pro
  pro:
    persona_pre_sp:            # 코드북 행 5–34, SP 이전 측정
      - SQ1_1                  # 시도
      - SQ1_2                  # 시군구
      - SQ2                    # 성별  (gender_label)
      - SQ3                    # 연령  (age, age_group)
      - QQ1                    # 평소 통행 목적
      - QQ2_1                  # 평소 출발 시각
      - QQ2_2                  # 평소 도착 시각
      - QQ3                    # 평소 총 소요시간
      - QQ4                    # 평소 편도 비용
      - QQ5                    # 평소 주이용 수단 (main_mode_label)
      - QQ6                    # 그 수단 이용 이유
      - QQ7
      # 통행 O/D 와 거주지 공간속성 (p01b_spatial_od.py 가 만든다).
      # 설문 Step 2 에서 묻는 선택 이전 정보다. 읍면동은 고유값이 817/724개라 제외.
      # spatial_prior 는 이름이 origin_* 이지만 실제로는 거주지 기준이라 residence_* 로 싣는다.
      - trip_origin_sido
      - trip_origin_sigungu
      - trip_dest_sido
      - trip_dest_sigungu
      - residence_region_type
      - residence_urbanization
      - residence_transit_accessibility
      - residence_congestion_prior
      - residence_parking_pressure
      - residence_first_last_mile_burden                    # 동행 여부
    persona_post_sp_but_time_invariant:   # 코드북 행 126–136, 사실 항목
      - D1                     # 직업
      - D2                     # 학력
      - D3                     # 혼인
      - D4_1                   # 가구원 수
      - D4_2                   # 18세 미만 자녀 수
      - D5                     # 가구 월평균 소득
      - D6                     # 가구 자동차 보유
      - D7                     # 운전면허 (license_label)
      - D8                     # 자동차 이용 가능성 (car_access_label)
      - D9                     # 일반 자동차 이용 방식
    task: *task

  # ---------------------------------------------------------------- Q_retro
  retro:
    include: pro
    additional_attitudes:      # 코드북 행 101–124, SP 블록 직후 측정
      - A1_1                   # 신기술 수용
      - A1_2                   # 시간 > 비용
      - A1_3                   # 비용 > 시간
      - A1_4                   # 환승·대기·혼잡 회피
      - A1_5                   # AV 안전 인식
      - A1_6                   # 무인 AV 불안
      - A1_7                   # AV 내 활동 가치
      - A1_8                   # AV 도입 시 대중교통 감소
      - A1_9                   # AV 보편화 시 자가용 필요성 감소
      - A1_10                  # 위치·이동정보 수집 우려
      - T1                     # 기존 택시 이용 변화
      - T4                     # 사회적 갈등 시 이용 의향
      - S1                     # 공유형 이용 의향
      - S2                     # 요금 할인·추가시간 수용
      # S3_1–S3_7 은 다중선택 문항이라 각 컬럼이 '선택했으면 코드값, 아니면 결측' 이다.
      # 값이 아니라 결측 여부가 신호이므로 반드시 이진화해서 쓴다 (transforms 참조).
      - S3_1                   # 응답 7,710 / 결측 5,358
      - S3_2
      - S3_3
      - S3_4
      - S3_5
      - S3_6
      - S3_7                   # 응답 30 (약 5명). 사실상 상수에 가까움 — 해석 시 주의

  # ---------------------------------------------------------------- DGP 생성용
  # 태도를 DGP 에 넣으면 행동세계가 정보조건별로 갈라져 비교가 성립하지 않는다.
  # 진실은 pro 스키마로만 만들고, 태도는 후보모형에만 추가되는 정보로 둔다.
  dgp_truth:
    include: pro

# -------------------------------------------------------------------- 변환 규칙
transforms:
  multi_select_to_binary:
    # 다중선택 문항. 원값을 그대로 쓰면 상수처럼 보이고 신호가 사라진다.
    columns: [S3_1, S3_2, S3_3, S3_4, S3_5, S3_6, S3_7]
    rule: notna_indicator      # 값이 있으면 1, 결측이면 0
    suffix: _sel

# -------------------------------------------------------------------- 제외 목록
excluded:
  degenerate:                  # Phase 1 감사에서 확인. 전량 결측 또는 상수.
    - Quality_Check            # 전부 1
    - SQ4                      # 전부 1 (스크리닝 통과자만 수록)
    - av_transfer_count        # 전량 결측
    - car_transfer_count
    - pm_transfer_count
    - walk_transfer_count
    - av_crowding_raw          # 전부 '여유'
    - car_crowding_raw
    - pm_crowding_raw
    - walk_crowding_raw
    - walk_wait_time_min       # 전부 0
    - walk_cost_1000won        # 전부 0

  label_and_derived:           # 결과 그 자체 또는 결과에서 파생
    - future_mode_label
    - future_mode_id
    - future_mode_2030
    - AV_choice_2030
    - av_choice
    - transition

  post_choice:                 # 선택 이후에만 존재하는 정보
    - av_days
    - AV_use_days_2030
    - av_reason_1
    - av_reason_2
    - av_reason_3
    - AV_reason_2030_1
    - AV_reason_2030_2
    - AV_reason_2030_3

  sp_contaminated:             # SP 표를 직접 참조하거나 선택에 조건부인 문항
    - T2                       # 택시 대비 수용 요금 — 방금 본 SP 요금이 기준점
    - T3                       # "앞의 선택표에서 보았던 요금을 기준으로" 명시
    - Q1B_*                    # 거리대별 고려요인 (선택 조건부)
    - Q2B_*
    - Q3B_*
    - Q4B_*
    - Q5B_*
    - Q6B_*
    - current_rating_1_2026     # Q*B_1–3 의 파생 컬럼 (고려요인). resolved 참조.
    - current_rating_2_2026
    - current_rating_3_2026
    - current_rating_1_2026_label
    - current_rating_2_2026_label
    - current_rating_3_2026_label

  redundant_with_counterfactual_lever:
    # 반사실에서 우리가 움직이는 값을 **그대로 복원할 수 있는** 중복 열. 남겨 두면
    # 반사실이 무력화된다.
    #
    # av_framing_percent 는 두 프레이밍(성공률 표기 / 실패율 표기)의 숫자를 한 열에 담은
    # 것이다. reliability = p if p>=50 else 100-p 로 av_service_reliability_pct 가 이 열에서
    # 100% 복원된다(2026-08-06 측정, 8개 조합 전부 일치). 문제는 p09 격자가 신뢰도만 바꾸고
    # 이 열은 원래 값으로 둔다는 점이다. 그러면 모형은 편집되지 않은 쪽을 보고 "신뢰도는
    # 그대로" 라고 읽어, A_* 사다리가 부분적으로 죽는다. 프레이밍 방향은
    # av_framing_attribute 가 이미 담고 있으므로 정보 손실도 없다.
    - av_framing_percent

  administrative:
    - block_ID              # 설문 블록 배정 번호. 여행자 속성이 아니라 설계 장부이고
                            # 프롬프트에도 없다. 빼면 4개 중 3개 모형이 test 에서 좋아졌다
                            # (logit +.006, rf +.002, nn +.016, xgb -.010).
    - A1_11                    # 품질확인 문항
    - Quality_Check
    - R1                       # 자유응답
    - Ran
    - IDX                      # 식별자 (respondent_id 로만 사용)

# -------------------------------------------------------------------- 확인 필요
resolved:
  - name: current_rating_1_2026 / current_rating_2_2026 / current_rating_3_2026
    verdict: exclude
    date: 2026-08-05
    evidence: >
      값이 1–7 이고 label 이 cost / time / wait_access_transfer / familiar_mode /
      crowding_comfort / driving_parking_fatigue / other 다. 즉 서비스 수준이 아니라
      '현재수단을 고를 때 고려한 요인' 이며, 2,178명 중 1,705명이 task 마다 값이 달라
      거리대별로 물어본 문항이다. 코드북의 Q1B_1–3 … Q6B_1–3 (SP 블록 내부, 방금 고른
      2026 수단에 조건부)과 동일한 항목이므로 excluded.sp_contaminated 에 해당한다.

# 고유값이 많아도 표 모형에 넣을 열. **측정 결과 비워 둔다.**
#
# 배경. LLM 프롬프트는 시군구(76개 값)를 읽는데 표 모형은 CARDINALITY_CAP=12 에 걸려
# 못 본다. 이 비대칭이 "LLM 이 이긴 건 목적지를 봤기 때문" 이라는 반박을 부를 수 있어
# 세 가지 방식으로 표 모형에 같은 정보를 주고 respondent-held-out test AUC 를 쟀다
# (HUMAN/pro seed42, 변경 전 -> 변경 후).
#
#   (B) 시군구 원핫 76수준       logit .657->.609  xgb .665->.623  rf .682->.675  nn .634->.599
#   (C) O/D 공간속성 12열        logit .657->.655  xgb .665->.660  rf .682->.676  nn .634->.615
#   (D) 거주-목적지 비교 4열     logit .657->.646  xgb .665->.667  rf .682->.679  nn .634->.612
#
# 셋 다 도움이 되지 않았고 (B) 는 네 모형 모두 뚜렷이 나빠졌다. 응답자 2,178명에 시군구가
# 76개면 구당 29명이라, 개발집합 응답자의 구별 기저율을 외울 뿐 처음 보는 응답자에게
# 옮겨가지 않는다. 그래서 **정보를 더 주지 않는 쪽을 택한다.**
#
# 이건 회피가 아니라 결과다. 원고에는 "공간정보를 세 방식으로 주어도 표 모형의
# 예측력은 오르지 않았다" 로 쓴다 - LLM 의 지명 접근이 교란요인이 아님을 보이는 근거다.
# 지역 표기 통일(한글->로마자)은 그대로 유지한다. 표기가 갈려 있는 것 자체가 오류다.
high_cardinality_allowlist: []

# DCM(panel_logit) 효용식에서만 제외하는 **선택 후 심리 문항**. ML·LLM 은 그대로 본다.
#
# 근거 (2026-08-17, DECISIONS D241):
# (1) 이 문항들은 선택과 같은 설문 회차에 응답된 사후 지표다. 구조적 효용식에 조건화하면
#     속성 계수가 오염된다 - 실측으로 HUMAN 의 ride 확률기울기가 포함 시 +0.00030,
#     제외 시 -0.00004 로 부호가 바뀐다 (fare 기울기는 -0.015 로 양쪽 모두 안정).
# (2) 태도를 효용에 넣는 정석 경로(ICLV)는 이미 기각했다. 넣으려면 측정방정식이 필요하고,
#     회귀변수로 직접 넣는 것은 그 대체가 아니다.
# (3) 참조 논문(Martin-Baos 2023)의 DCM 도 속성+사회인구 변수만 쓴다.
# ML 모형은 예측 기술로서 전체 행렬을 유지한다 - 각 계열의 표준 관행대로 비교한다.
dcm_postchoice_excluded:
  - A1_1
  - A1_2
  - A1_3
  - A1_4
  - A1_5
  - A1_6
  - A1_7
  - A1_8
  - A1_9
  - A1_10
  - S3_1_sel
  - S3_2_sel
  - S3_3_sel
  - S3_4_sel
  - S3_5_sel
  - S3_6_sel
  - S3_7_sel
  - T1
  - T4
  - S1
  - S2
